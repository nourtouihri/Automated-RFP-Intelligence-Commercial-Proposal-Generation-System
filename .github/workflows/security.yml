name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets-scan:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  python-security-lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dir: [detection, research, shared, rag, ingestion]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install Bandit
        run: pip install bandit==1.9.4
      - name: Bandit scan
        run: |
          if [ -d "${{ matrix.dir }}" ]; then
            bandit -r ${{ matrix.dir }} -x "*/tests" -lll
          else
            echo "Directory ${{ matrix.dir }} not present yet, skipping."
          fi

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Audit dependencies
        # Risk acceptances per team decision 2026-10-20 ("functionality over
        # security" for this release). sentences-transformers is pinned <5.0
        # (s-t 5+ pulls torchcodec during import, which needs a separate
        # shared FFmpeg install on Windows); transformers fixes only exist
        # in 5.x, so these IDs are unreachable while the cap stands.
        # Explicit IDs only: any NEW advisory still fails this job.
        # Revisit when the sentence-transformers cap is lifted.
        run: >
          pip-audit -r requirements.txt -r requirements.lock
          --ignore-vuln PYSEC-2026-4164
          --ignore-vuln PYSEC-2025-217
          --ignore-vuln PYSEC-2026-2288
          --ignore-vuln PYSEC-2026-2289
          --ignore-vuln PYSEC-2026-2290
          --ignore-vuln PYSEC-2026-3929
          --ignore-vuln PYSEC-2026-4174

  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.176.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: semgrep scan --config auto --error --severity WARNING --exclude tests --exclude .venv --exclude '*.db'
