<script>
  (function () {
    var p = new URLSearchParams(location.search).get('theme');
    if (!p) { try { p = JSON.parse(localStorage.getItem('uip.prefs') || '{}').theme; } catch (e) {} }
    var dark = p && p !== 'system' ? p === 'dark' : window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
